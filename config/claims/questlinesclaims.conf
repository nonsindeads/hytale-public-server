# QuestLinesClaims configuration
# Schema version (auto-managed; do not edit).
config_version=20
# Server default language for Claims messages. Used only as a fallback:
# a player's QuestLines /qlconfig language setting and their Hytale client
# locale both win over this. Bundled locales: en-US, de-DE, es-ES, fr-FR, pt-BR, ru-RU.
default_locale=de-DE
# Default chunk limit per player (extend via questlinesclaims.claim.chunks.N perm).
default_max_chunks=3
# Hard ceiling on a player's total chunk allowance (base + perms + bonus chunks).
# 0 = no cap.
max_chunks_cap=9
# Claim Shards a player spends per extra chunk via /claim buychunk (min 1).
chunk_cost_shards=32
# Default rent-region limit per player (extend via questlinesclaims.rent.limit.N perm).
default_max_rent_regions=1
# ── Claim homes ────────────────────────────────────────────────────
# Per-player /claim sethome limit (extend via questlinesclaims.home.limit.N perm).
default_max_claim_homes=3
# Seconds the player must stand still (and avoid damage) before a home teleport fires (0 = instant).
home_teleport_warmup_seconds=3
# Cooldown in seconds between successful home teleports (0 = none).
home_teleport_cooldown_seconds=30
# Show the Rent/Buy button on the claim map. Existing data is preserved either way.
rent_buy_enabled=true
# Rent expiry check interval (seconds).
rent_check_interval=300
# Days after expiry before a locked region is reset.
rent_grace_days=3
# Claim decay after owner offline this long (e.g. 30d, 12h, 1d2h). 0 or empty disables.
claim_decay_time=30d
# Pre-expiry tenant warning thresholds, comma-separated (e.g. 7d,1d,1h,30m).
expiry_warn_times=7d,1d,1h
# Sound played with expiry notifications (empty = silent).
expiry_sound_effect=SFX_Poop_Bounce
# Refund pro-rated remaining lease balance on region reset.
refund_on_reset=false
# Chunk-map grid side length (odd number, e.g. 7, 9, 11, 13).
map_grid_size=15
# Minimum chunk gap required between different players' claims (0 = no gap).
distance_between_claims=0
# Claim colour overlay opacity (0-100).
claim_overlay_opacity=50
# Draw a thin outline halo on unclaimed chunks bordering a claim.
claim_overlay_halo=false
# How the claim overlay shares the world map with other map plugins (e.g. OrbisGuard),
# which can only have one base map per world:
#   overlay = paint claim tints on top of whatever map provider is already set (coexist);
#   replace = own the map fully (vanilla terrain base + claim tints);
#   off     = don't touch the world map (let the other plugin own it).
claim_map_mode=overlay

# ── World borders ──────────────────────────────────────────────────
# Per-world hard boundary (admins included). Keys:
#   world_border.<world>.enabled  = true | false
#   world_border.<world>.shape    = SQUARE | CIRCULAR
#   world_border.<world>.radius   = half-extent (square) or radius (circular), in blocks
#   world_border.<world>.center_x = block X of the centre
#   world_border.<world>.center_z = block Z of the centre
# Example (uncomment and set your world name):
# world_border.default.enabled=true
# world_border.default.shape=SQUARE
# world_border.default.radius=5000
# world_border.default.center_x=0
# world_border.default.center_z=0

# Permission flags allowed in unclaimed wilderness (comma-separated).
# Valid flags: BUILD,BREAK,INTERACT,HARVEST,CONTAINER,DOOR,PVP,FRIENDLY_FIRE,PVE,ENTRY,EXIT,PORTAL,SIT,EXPLOSIONS,SPAWN,FALL_DAMAGE,KEEP_INVENTORY,MOB_CAPTURE,FIRE_SPREAD,HAMMER_USE,FLY,PREVENT_DURABILITY_LOSS,DROP_ITEM,PICKUP_ITEM,CRAFTING,PREVENT_DAMAGE
wilderness_flags=BUILD,BREAK,INTERACT,CONTAINER,DOOR,PVP,FRIENDLY_FIRE,PVE,ENTRY,EXIT,PORTAL,SIT,EXPLOSIONS,SPAWN,FALL_DAMAGE,MOB_CAPTURE,MANAGE_SUBREGIONS,FIRE_SPREAD,HAMMER_USE,DROP_ITEM,PICKUP_ITEM,CRAFTING,HARVEST
# Per-world wilderness override: wilderness_flags_world.<world>=BUILD,BREAK,...  (empty = deny all).
wilderness_flags_world.himmelsinsel=INTERACT,DOOR,PVE,ENTRY,EXIT,PORTAL,SIT,FALL_DAMAGE,MOB_CAPTURE,DROP_ITEM,PICKUP_ITEM,CRAFTING
# Default flags for newly created claims/regions (existing regions unaffected).
default_claim_flags=PVE,ENTRY,EXIT,SIT,FALL_DAMAGE,MOB_CAPTURE,FIRE_SPREAD,DROP_ITEM
default_admin_flags=PVE,ENTRY,EXIT,SIT,FALL_DAMAGE,MOB_CAPTURE,FIRE_SPREAD,DROP_ITEM
default_rent_flags=PVE,ENTRY,EXIT,SIT,FALL_DAMAGE,MOB_CAPTURE,FIRE_SPREAD,DROP_ITEM
default_buy_flags=PVE,ENTRY,EXIT,SIT,FALL_DAMAGE,MOB_CAPTURE,FIRE_SPREAD,DROP_ITEM

# Give a married player's spouse access to their claims automatically, without
# either having to add the other as a claim member. Requires QuestLines Core and
# the BetterMarriage mod (5.0.2+); without them this never applies.
# Access is resolved live on every action, so a divorce revokes it immediately -
# no member rows are written and there is nothing to clean up afterwards.
spouse_claim_access_enabled=false
# Which flags the spouse gets. The default is deliberately member-like and omits
# MANAGE_SUBREGIONS so a spouse cannot re-carve or re-permission the land.
spouse_claim_access_flags=BUILD,BREAK,INTERACT,CONTAINER,DOOR,ENTRY,EXIT,SIT,CRAFTING,HARVEST

# ── Disabled flags ─────────────────────────────────────────────────
# Flags hidden from player permission editors (admin/wilderness unaffected).
# Saved flag state is preserved on disk; only the UI toggles are suppressed.
disabled_flags=EXIT,SPAWN,KEEP_INVENTORY,FLY,PREVENT_DURABILITY_LOSS

# ── Entity whitelist ───────────────────────────────────────────────
# Entity ids that bypass SPAWN and PVE protections (block protections unaffected).
# Matches NPC role/type id or persistent model asset id (e.g. HyFishingBobber).
# Case-insensitive; * wildcards supported (e.g. HyFishing*, *Bobber, *Fish*).
entity_whitelist=HyFishingBobber

# ── Block whitelist ────────────────────────────────────────────────
# Block ids that bypass ALL block protections (break/place/use/damage)
# everywhere - admin regions, player claims, and wilderness alike.
# Intended for special blocks from other plugins that players must always
# be able to interact with, e.g. gravestones holding a dead player's items.
# Matches BlockType.getId(); case-insensitive; * wildcards supported
# (e.g. Gravestone*, *_Grave, *tombstone*). Empty by default.
block_whitelist=

# ── Plot worlds (/plot) ────────────────────────────────────────────
# The grid itself (plot size, padding, city block size, road width) is NOT
# configured here - it belongs to each plot world's own generator, set when
# the world is created with /plot world create. These keys are the parts that
# can change without moving a block.
# How a plot is paid for: free | shards | currency | item.
#   shards   - Claim Shards, the same currency as /claim buychunk
#   currency - VaultUnlocked balance (buying is refused if Vault is absent)
#   item     - any item id, consumed from the buyer's inventory
plot_price_mode=free
# Base price of one plot, in the units of the mode above.
plot_price_amount=0
# Item id charged when plot_price_mode=item. Case-sensitive (e.g. Rock_Stone).
plot_price_item=
# Price growth per plot already owned: price = base * (1 + scaling * owned).
# 0 = every plot costs the same; 0.5 = each further plot costs 50% more.
plot_price_scaling=0.0
# Plots one player may own per plot world (extend via questlinesclaims.plot.limit.N).
plot_max_per_player=4
# Buying a plot next to one you own folds it into the same holding.
plot_can_merge=true
# Allow a merge to span a road. The road itself always stays public and
# unbuildable - a holding is a set of plots, not a rectangle.
plot_merge_across_roads=true
# Allow a player to hold plots that are not connected to each other.
plot_allow_non_adjacent=true
# What anyone may do on roads and in the gaps between plots.
plot_road_flags=INTERACT,DOOR,PVE,ENTRY,EXIT,PORTAL,SIT,FALL_DAMAGE,MOB_CAPTURE,DROP_ITEM,PICKUP_ITEM,CRAFTING
# What anyone may do on a plot nobody has bought yet.
plot_unowned_flags=INTERACT,DOOR,PVE,ENTRY,EXIT,PORTAL,SIT,FALL_DAMAGE,MOB_CAPTURE,DROP_ITEM,PICKUP_ITEM,CRAFTING

# ── Region transition notification ─────────────────────────────────
# How region/claim/wilderness crossings are announced. Modes: title, hud, both, none.
notification_mode=hud
# Default for the per-claim/region "subtitle on top" toggle (when left on Default).
notification_subtitle_on_top=false
# HUD anchor: TopLeft, TopCenter, TopRight, Center, BottomLeft, BottomCenter, BottomRight.
notification_hud_position=TopCenter
# HUD pixel offset from the anchor (X ignored for *Center positions).
notification_hud_offset_x=0
notification_hud_offset_y=80
# Entry/exit animation: none, slide, fade, pop.
notification_hud_animation=slide
# Duration of one enter/exit animation half (ms).
notification_hud_animation_ms=400
# Time the HUD stays fully visible between enter and exit animations (ms).
notification_hud_visible_ms=2500

# ── Permission groups ──────────────────────────────────────────────
# Server-wide ranks. Each id creates perm node questlinesclaims.group.<id>;
# holders are auto-members of that group on every region (editable per-region).
# Comma-separated, lowercase. Reserved ids (owner/trusted/untrusted) ignored.
groups=

# ── Database ───────────────────────────────────────────────────────
# Backend: sqlite (local file) | mysql | mariadb. Restart required to apply changes.
# host/port/name/user/password/ssl/extra_params only apply when not sqlite.
database_type=sqlite
database_host=localhost
database_port=3306
database_name=questlinesclaims
database_user=root
database_password=
database_use_ssl=false
# Extra JDBC URL params (appended after &).
database_extra_params=
